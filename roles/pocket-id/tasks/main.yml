# roles/pocketid/tasks/main.yml
---
- name: Create pocketid namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: pocketid

- name: Create PVC for pocketid data
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: pocketid-data-pvc
        namespace: pocketid
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: rook-ceph-block

- name: Create ConfigMap for pocketid environment variables
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: pocketid-config
        namespace: pocketid
      data:
        APP_URL: "https://id.{{ nginx_ingress_hostname }}"
        TRUST_PROXY: "true"
        MAXMIND_LICENSE_KEY: "{{ maxmind_license_key | default('') }}"
        PUID: "1000"
        PGID: "1000"

- name: Deploy pocketid
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pocketid
        namespace: pocketid
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: pocketid
        strategy:
          type: Recreate
        template:
          metadata:
            labels:
              app: pocketid
          spec:
            containers:
              - name: pocketid
                image: ghcr.io/pocket-id/pocket-id:v1
                env:
                  - name: TZ
                    value: "{{ timezone }}"
                envFrom:
                  - configMapRef:
                      name: pocketid-config
                ports:
                  - containerPort: 1411
                    name: http
                volumeMounts:
                  - name: data
                    mountPath: /app/backend/data
                # livenessProbe:
                #   httpGet:
                #     path: /health
                #     port: http
                #   initialDelaySeconds: 10
                #   periodSeconds: 90
                #   timeoutSeconds: 5
                # readinessProbe:
                #   httpGet:
                #     path: /health
                #     port: http
                #   initialDelaySeconds: 10
                #   periodSeconds: 90
                #   timeoutSeconds: 5
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: pocketid-data-pvc

# Deploy PocketID ClusterIP Service (for ingress and both modes)
- name: Create pocketid ClusterIP service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: pocketid
        namespace: pocketid
      spec:
        type: ClusterIP
        selector:
          app: pocketid
        ports:
          - protocol: TCP
            port: 1411
            targetPort: 1411
  when: service_type in ['ingress', 'both', 'clusterip']

# Deploy PocketID LoadBalancer Service (for loadbalancer and both modes)
- name: Create pocketid LoadBalancer service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: pocketid-lb
        namespace: pocketid
      spec:
        type: LoadBalancer
        selector:
          app: pocketid
        ports:
          - protocol: TCP
            port: 1411
            targetPort: 1411
  when: service_type in ['loadbalancer', 'both']

# Deploy PocketID Ingress (for ingress and both modes)
- name: Create pocketid ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: pocketid-ingress
        namespace: pocketid
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      spec:
        rules:
          - host: "id.{{ nginx_ingress_hostname }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: pocketid
                      port:
                        number: 1411
  when: service_type in ['ingress', 'both']