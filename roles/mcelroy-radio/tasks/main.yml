---
- name: Create mcelroy-radio namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ mcelroy_radio_namespace }}"

- name: Create ConfigMap for fund-goal.json
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mcelroy-radio-fund-goal
        namespace: "{{ mcelroy_radio_namespace }}"
      data:
        fund-goal.json: |
          {
            "fund_goal": {
              "target_amount": 60,
              "current_amount": 0,
              "currency": "USD",
              "description": "At the cheapest level this costs $60 per year.",
              "campaign_active": true,
              "last_updated": "2025-07-02T00:00:00Z"
            }
          }

