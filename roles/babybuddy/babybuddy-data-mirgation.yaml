# First, create the PVC (run your Ansible playbook or apply this separately)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: babybuddy-config-pvc
  namespace: babybuddy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block

---
# Migration pod - includes openssh-client for SCP
apiVersion: v1
kind: Pod
metadata:
  name: babybuddy-migration
  namespace: babybuddy
spec:
  containers:
    - name: migration
      image: ubuntu:22.04
      command: ["/bin/bash"]
      args:
        [
          "-c",
          "apt-get update && apt-get install -y openssh-client rsync sshpass && while true; do sleep 3600; done",
        ]
      volumeMounts:
        - name: target-pvc
          mountPath: /target
  volumes:
    - name: target-pvc
      persistentVolumeClaim:
        claimName: babybuddy-config-pvc
  restartPolicy: Never
