---
# Pinepods Admin Configuration
pinepods_admin_namespace: pinepods-admin
pinepods_admin_image: madeofpendletonwool/pinepods-admin:latest
pinepods_admin_port: 8080
pinepods_admin_hostname: "admin.{{ nginx_ingress_hostname }}"

# Database Configuration
pinepods_admin_db_type: sqlite
pinepods_admin_db_name: /app/data/forms.db

# NTFY Configuration
pinepods_admin_ntfy_enabled: true
pinepods_admin_ntfy_url: "https://ntfy.{{ nginx_ingress_hostname }}"
pinepods_admin_ntfy_topic: pinepods-admin

# Admin Credentials
pinepods_admin_username: admin
pinepods_admin_password: changeme
pinepods_admin_feedback_email: "admin@{{ nginx_ingress_hostname }}"

# Google Play Configuration
pinepods_admin_google_package_name: com.gooseberrydevelopment.pinepods
pinepods_admin_google_service_account_file: "{{ lookup('env', 'HOME') }}/Downloads/service-account.json"

# SMTP Configuration
pinepods_admin_smtp_host: ""
pinepods_admin_smtp_port: 587
pinepods_admin_smtp_username: ""
pinepods_admin_smtp_password: ""
pinepods_admin_smtp_from: ""

# CORS Configuration
pinepods_admin_cors_origins: "https://docs.pinepods.online,https://pinepods.online"

# Storage Configuration
pinepods_admin_data_storage_size: 2Gi
pinepods_admin_config_storage_size: 1Gi